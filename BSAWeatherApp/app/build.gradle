plugins {
    id 'com.android.application'
}

// Resolve the OpenWeather API key: environment variable, then .env file, then empty.
def resolveOpenWeatherApiKey() {
    def fromEnv = System.getenv('OPENWEATHER_API_KEY')
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }
    def envFile = rootProject.file('.env')
    if (envFile.isFile()) {
        for (String rawLine : envFile.readLines('UTF-8')) {
            def line = rawLine.trim()
            if (line.isEmpty() || line.startsWith('#')) continue
            int eq = line.indexOf('=')
            if (eq < 0) continue
            if (line.substring(0, eq).trim() != 'OPENWEATHER_API_KEY') continue
            def value = line.substring(eq + 1).trim()
            if (value.length() >= 2 &&
                    ((value.startsWith('"') && value.endsWith('"')) ||
                     (value.startsWith("'") && value.endsWith("'")))) {
                value = value.substring(1, value.length() - 1)
            }
            return value
        }
    }
    return ''
}

android {
    namespace "com.example.bsaweatherapp"
    compileSdk 36

    defaultConfig {
        applicationId "com.example.bsaweatherapp"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def apiKey = resolveOpenWeatherApiKey().replace("\\", "\\\\").replace("\"", "\\\"")
        buildConfigField "String", "OPENWEATHER_API_KEY", "\"${apiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.10.0'
    implementation 'androidx.navigation:navigation-ui:2.10.0'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
